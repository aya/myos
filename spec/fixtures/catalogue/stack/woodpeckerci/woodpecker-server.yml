version: '3.6'

services:
  server:
    environment:
    - WOODPECKER_ADMIN=${WOODPECKER_ADMIN:-}
    - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
    - WOODPECKER_GITEA=${WOODPECKER_GITEA:-false}
    - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT:-}
    - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET:-}
    - WOODPECKER_GITEA_URL=${WOODPECKER_GITEA_URL:-}
    - WOODPECKER_GITHUB=${WOODPECKER_GITHUB:-false}
    - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT:-}
    - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET:-}
    - WOODPECKER_GITHUB_URL=${WOODPECKER_GITHUB_URL:-https://github.com}
    - WOODPECKER_GITLAB=${WOODPECKER_GITLAB:-false}
    - WOODPECKER_GITLAB_CLIENT=${WOODPECKER_GITLAB_CLIENT:-}
    - WOODPECKER_GITLAB_SECRET=${WOODPECKER_GITLAB_SECRET:-}
    - WOODPECKER_GITLAB_URL=${WOODPECKER_GITLAB_URL:-https://gitlab.com}
    - WOODPECKER_GRPC_ADDR=${WOODPECKER_GRPC_ADDR:-:9000}
    - WOODPECKER_GRPC_SECURE=${WOODPECKER_GRPC_SECURE:-false}
    - WOODPECKER_GRPC_VERIFY=${WOODPECKER_GRPC_VERIFY:-true}
    - WOODPECKER_HOST=${WOODPECKER_HOST:-}
    - WOODPECKER_LOG_LEVEL=${WOODPECKER_LOG_LEVEL:-info}
    - WOODPECKER_OPEN=${WOODPECKER_OPEN:-true}
    - WOODPECKER_ORGS=${WOODPECKER_ORGS:-}
    - WOODPECKER_REPO_OWNERS=${WOODPECKER_REPO_OWNERS:-}
    - WOODPECKER_SERVER_ADDR=${WOODPECKER_SERVER_ADDR:-:8000}
    - WOODPECKER_SERVER_ADDR_TLS=${WOODPECKER_SERVER_ADDR_TLS:-:8443}
    labels:
    - SERVICE_8000_CHECK_HTTP=/healthz
    - SERVICE_8000_NAME=${COMPOSE_SERVICE_NAME}-server-8000
    - SERVICE_8000_TAGS=${WOODPECKER_SERVICE_8000_TAGS:-}
    networks:
     - private
     - public
    ports:
    - 8000
    restart: always
    volumes:
    - server-data:/var/lib/woodpecker

volumes:
  server-data:
