version: '3.6'

services:
  agent:
    command: agent
    depends_on:
      server:
        condition: service_healthy
    environment:
    - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
    - WOODPECKER_SERVER=${WOODPECKER_SERVER:-server:9000}
    - WOODPECKER_MAX_WORKFLOWS=${WOODPECKER_MAX_WORKFLOWS:-2}
    networks:
    - private
    restart: always
    volumes:
    - agent-config:/etc/woodpecker
    - ${DOCKER_SOCKET_LOCATION:-/var/run/docker.sock}:/var/run/docker.sock
volumes:
  agent-config:
