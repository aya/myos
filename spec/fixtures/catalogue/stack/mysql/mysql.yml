version: '3.6'

services:
  mysql:
    environment:
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    labels:
    - SERVICE_3306_NAME=${COMPOSE_SERVICE_NAME}-mysql-3306
    - SERVICE_3306_CHECK_TCP=true
    - SERVICE_33060_IGNORE=true
#    - SERVICE_CHECK_SCRIPT=docker-healthcheck $$SERVICE_IP
    networks:
    - private
    ports:
    - 3306
    volumes:
    - mysql:/var/lib/mysql
    restart: always

volumes:
  mysql:
