services:
  fabio:
    image: fabiolb/fabio:1.6.3
    container_name: ${HOST_COMPOSE_PROJECT_NAME:-localhost}-fabio
    depends_on: [consul]
    ports:
      - "80:80"
      - "443:443"
    environment:
      FABIO_REGISTRY_CONSUL_ADDR: ${DOCKER_HOST_INET4:-127.0.0.1}:8500
      FABIO_LOG_ACCESS_TARGET: ${HOST_FABIO_LOG_ACCESS:-}
    networks:
      - public
